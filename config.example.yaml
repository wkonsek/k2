# ~/.k2/config.yaml
# uncomment a line to change it. a bad value is skipped and the default stays.
# bools also accept yes/no and on/off.

# theme: nord
#   nord, dracula, catppuccin, gruvbox, tokyo-night, kanagawa, rose-pine,
#   everforest, one-dark, solarized-dark, material, matrix, solarized-light,
#   night-owl, ayu, monokai, github-dark, flexoki, oxocarbon, poimandres,
#   horizon, zenburn, catppuccin-latte, custom
#   custom needs colors, each #rrggbb. required bg, muted, text, accent,
#   accent2, accent3, danger, ok, warn, bright. optional sel_bg, sel_fg, light
# prod: [prod-eu-1, prod, kind-prod]   # exact context names, red border
# max_panes: 4            # 1..8
# state_dir: ~/.k2
# kubectl_output: default # default | wide | yaml | json | name
# aliases:                # short name: resource
#   deps: deployments
#   sts: statefulsets
#   sub: subscriptions.operators.coreos.com
#   csv: clusterserviceversions.operators.coreos.com
#   ip: installplans.operators.coreos.com
#   rt: routes.route.openshift.io
