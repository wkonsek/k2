name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: test
        run: make test

      - name: build
        run: make build

      - name: package tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: dist
        run: make dist

      - name: github release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm